<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Developer icon">
  <title>Developer</title>

  <!-- 白底 -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- 浅灰圆角边框，不需要可删除 -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- 显示器外框 -->
  <rect x="112" y="136" width="288" height="200" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>

  <!-- 屏幕 -->
  <rect x="124" y="148" width="264" height="176" rx="16" fill="#0f172a"/>

  <!-- 窗口圆点 -->
  <circle cx="148" cy="172" r="6" fill="#ef4444"/>
  <circle cx="168" cy="172" r="6" fill="#f59e0b"/>
  <circle cx="188" cy="172" r="6" fill="#22c55e"/>

  <!-- 左括号 < -->
  <path d="M218 216 L188 244 L218 272"
        fill="none"
        stroke="#38bdf8"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- 右括号 > -->
  <path d="M294 216 L324 244 L294 272"
        fill="none"
        stroke="#a78bfa"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- 斜杠 / -->
  <path d="M270 206 L242 282"
        fill="none"
        stroke="#f472b6"
        stroke-width="14"
        stroke-linecap="round"/>

  <!-- 光标 -->
  <rect x="300" y="286" width="22" height="8" rx="4" fill="#38bdf8"/>

  <!-- 底座 -->
  <rect x="208" y="344" width="96" height="16" rx="8" fill="#cbd5e1"/>
  <rect x="176" y="368" width="160" height="20" rx="10" fill="#e2e8f0"/>
</svg>